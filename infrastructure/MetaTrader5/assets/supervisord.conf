; Process tree for the MT5 image.
;
; Order matters: the X server must exist before openbox/x11vnc/the terminal, so
; priorities ascend. Everything that touches the desktop needs DISPLAY=:0, which
; is set globally in the Dockerfile but repeated here because supervisor does not
; inherit an interactive shell's environment.

[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_VNC_GEOMETRY)sx24 -ac -nolisten tcp +extension GLX +render -noreset
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox
environment=DISPLAY=":0"
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; 5900 is loopback-only: the only way in is through noVNC on 8080, so the
; ingress in front of 8080 is the single place authentication has to be right.
[program:x11vnc]
command=/usr/bin/x11vnc -display :0 -forever -shared -nopw -rfbport 5900 -localhost -quiet
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:%(ENV_NOVNC_PORT)s 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Not /portable: terminal data then lives under the wine prefix's AppData, which
; is the directory worth putting on a volume if logins should survive restarts.
[program:metatrader]
command=/usr/bin/wine "/opt/wineprefix/drive_c/Program Files/MetaTrader 5/terminal64.exe"
environment=DISPLAY=":0",WINEPREFIX="/opt/wineprefix"
priority=50
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rpyc]
command=/bin/sh /root/run_server.sh
environment=DISPLAY=":0",WINEPREFIX="/opt/wineprefix"
priority=60
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
